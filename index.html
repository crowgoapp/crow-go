<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crow Go - المنصة الذكية للوسطاء</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d233a">
    <!-- مكتبة Supabase عبر CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- الشاشة الرئيسية -->
        <div id="landing-screen">
            <div class="header">
                <div class="logo-text">🦅 Crow Go</div>
                <div class="subtitle">منظومة الإدارة الذكية للوسطاء الميدانيين</div>
            </div>

            <div class="features-box">
                <b>✨ مميزات المنصة:</b>
                <ul>
                    <li>إدارة عروضك وطلباتك بقاعدة بيانات سحابية آمنة.</li>
                    <li>إصدار ألبوم صور وكاثالوجات احترافية.</li>
                </ul>
            </div>

            <button class="btn" onclick="router.showScreen('login-screen')">تسجيل دخول (مستخدم حالي)</button>
            <button class="btn btn-secondary" onclick="router.showScreen('register-screen')">حساب جديد (أسبوع مجاني)</button>
            
            <div class="text-center" style="margin-top: 20px;">
                <button onclick="router.openAdminLogin()" class="link-btn">⚙️ دخول السوبر أدمن</button>
            </div>
        </div>

        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen" class="hidden">
            <div class="header"><h2>تسجيل الدخول</h2></div>
            <div class="input-group"><label>رقم الهاتف المحمول</label><input type="tel" id="login-phone" placeholder="010XXXXXXXX" maxlength="11" /></div>
            <div class="input-group"><label>الرقم السري (PIN - 4 أرقام)</label><input type="password" id="login-pin" maxlength="4" placeholder="****" /></div>
            <button class="btn" onclick="handleLogin()">دخول لوحة التحكم</button>
            <div class="text-center"><button class="link-btn" onclick="router.showScreen('landing-screen')">← العودة للرئيسية</button></div>
        </div>

        <!-- شاشة حساب جديد -->
        <div id="register-screen" class="hidden">
            <div class="header"><h2>حساب جديد</h2></div>
            <div class="input-group"><label>الاسم الكامل</label><input type="text" id="reg-name" /></div>
            <div class="input-group"><label>رقم الهاتف</label><input type="tel" id="reg-phone" maxlength="11" placeholder="010XXXXXXXX" /></div>
            <div class="input-group"><label>الرقم السري (PIN - 4 أرقام)</label><input type="password" id="reg-pin" maxlength="4" placeholder="****" /></div>
            <div class="input-group"><label>المحافظة</label><input type="text" id="reg-gov" /></div>
            <div class="input-group">
                <label>المهنة</label>
                <select id="reg-prof">
                    <option value="عقارات">عقارات</option>
                    <option value="سيارات">سيارات</option>
                    <option value="دليفري">دليفري</option>
                </select>
            </div>
            <button class="btn" onclick="handleRegister()">إنشاء الحساب</button>
            <div class="text-center"><button class="link-btn" onclick="router.showScreen('landing-screen')">← العودة للرئيسية</button></div>
        </div>

        <!-- لوحة تحكم السوبر أدمن -->
        <div id="admin-dashboard" class="hidden">
            <div class="header">
                <h2>لوحة تحكم السوبر أدمن 👑</h2>
                <div class="subtitle">إدارة النظام والوسطاء</div>
            </div>
            <div id="admin-waseets-container"></div>
            <button type="button" class="btn btn-secondary" style="margin-top:20px;" onclick="router.showScreen('landing-screen')">خروج</button>
        </div>

        <!-- لوحة تحكم الوسيط -->
        <div id="waseet-dashboard" class="hidden">
            <div class="header">
                <div class="logo-text">🦅 Crow Go</div>
                <div class="subtitle" id="waseet-welcome-text">مرحباً بك</div>
            </div>
            <div style="display: flex; gap: 6px; margin-bottom: 12px;">
                <button type="button" class="btn" onclick="waseetApp.openNewProductModal()" style="flex: 1; margin:0;">+ إضافة منتج</button>
                <button type="button" class="btn btn-warning" onclick="waseetApp.openNewOrderModal()" style="flex: 1; margin:0;">+ تسجيل طلب</button>
            </div>
            <div id="products-list-container"></div>
            <button type="button" class="btn btn-secondary" style="margin-top:15px;" onclick="router.showScreen('landing-screen')">تسجيل الخروج</button>
        </div>
    </div>

    <!-- نافذة إضافة منتج منبثقة -->
    <div id="product-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:10000;">
        <div style="background:#fff; padding:20px; border-radius:12px; width:90%; max-width:400px; box-sizing:border-box;">
            <h3>إضافة منتج جديد</h3>
            <div class="input-group"><label>اسم المنتج</label><input type="text" id="prod-name" /></div>
            <div class="input-group"><label>السعر (ج.م)</label><input type="number" id="prod-price" /></div>
            <div class="input-group"><label>صورة المنتج</label><input type="file" id="prod-image" accept="image/*" /></div>
            <button class="btn" onclick="waseetApp.saveNewProduct()">حفظ المنتج</button>
            <button class="btn btn-secondary" onclick="waseetApp.closeNewProductModal()">إلغاء</button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- ربط ملفات الجافا سكريبت -->
    <script src="app.js"></script>
    <script src="waseet.js"></script>
    <script src="admin.js"></script>
</body>
</html>
